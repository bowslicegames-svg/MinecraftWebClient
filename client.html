<!-- client.html (simplified) -->
<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link Oracle</title>
<body>
<h2>Link Oracle (paste OCI config)</h2>
<textarea id="oci" rows=10 cols=60 placeholder="[DEFAULT]
user=ocid1.user...
tenancy=ocid1.tenancy...
region=us-ashburn-1
fingerprint=aa:bb:...
key_file=-----BEGIN PRIVATE KEY-----..."></textarea>
<br>
<button id="link">Link Oracle</button>
<button id="create">Create Always Free VM</button>
<pre id="out"></pre>
<script>
const BACKEND = "https://minecraftwebclient-backend.onrender.com";
document.getElementById('link').onclick = async () => {
  const cfg = document.getElementById('oci').value;
  const r = await fetch(BACKEND + '/oracle/link', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:cfg})});
  document.getElementById('out').textContent = await r.text();
};
document.getElementById('create').onclick = async () => {
  const r = await fetch(BACKEND + '/oracle/create-vm', {method:'POST'});
  document.getElementById('out').textContent = await r.text();
};
</script>
</body>
