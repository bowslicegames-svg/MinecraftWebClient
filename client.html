<body style="margin:0; overflow:hidden; background:black;">
    <canvas id="mcCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

    <script>
        const canvas = document.getElementById("mcCanvas");
        const renderer = new THREE.WebGLRenderer({ canvas });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);

        // -----------------------------
        // BLOCK TEXTURE ATLAS
        // -----------------------------
        const loader = new THREE.TextureLoader();
        const atlas = loader.load("https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.21.1/assets/minecraft/textures/block/stone.png");

        atlas.magFilter = THREE.NearestFilter;
        atlas.minFilter = THREE.NearestFilter;

        // -----------------------------
        // BLOCK MATERIAL
        // -----------------------------
        const blockMaterial = new THREE.MeshBasicMaterial({
            map: atlas
        });

        // -----------------------------
        // BLOCK GEOMETRY
        // -----------------------------
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);

        function addBlock(x, y, z) {
            const mesh = new THREE.Mesh(blockGeometry, blockMaterial);
            mesh.position.set(x, y, z);
            scene.add(mesh);
        }

        // -----------------------------
        // GENERATE A SIMPLE CHUNK
        // -----------------------------
        for (let x = -5; x <= 5; x++) {
            for (let z = -5; z <= 5; z++) {
                addBlock(x, 0, z);
            }
        }

        // -----------------------------
        // CAMERA CONTROLS (MOUSE LOOK)
        // -----------------------------
        let pitch = 0;
        let yaw = 0;

        document.body.onclick = () => {
            document.body.requestPointerLock();
        };

        document.addEventListener("mousemove", (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

                camera.rotation.set(pitch, yaw, 0);
            }
        });

        // -----------------------------
        // MOVEMENT (WASD)
        // -----------------------------
        const keys = {};
        document.addEventListener("keydown", (e) => (keys[e.key] = true));
        document.addEventListener("keyup", (e) => (keys[e.key] = false));

        function updateMovement(delta) {
            const speed = 5 * delta;

            const forward = new THREE.Vector3(
                -Math.sin(yaw),
                0,
                -Math.cos(yaw)
            );

            const right = new THREE.Vector3(
                Math.cos(yaw),
                0,
                -Math.sin(yaw)
            );

            if (keys["w"]) camera.position.addScaledVector(forward, speed);
            if (keys["s"]) camera.position.addScaledVector(forward, -speed);
            if (keys["a"]) camera.position.addScaledVector(right, -speed);
            if (keys["d"]) camera.position.addScaledVector(right, speed);
        }

        // -----------------------------
        // MAIN LOOP
        // -----------------------------
        let last = performance.now();

        function loop() {
            const now = performance.now();
            const delta = (now - last) / 1000;
            last = now;

            updateMovement(delta);

            renderer.render(scene, camera);
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
