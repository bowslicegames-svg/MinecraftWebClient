<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Web Client</title>

    <script src="https://unpkg.com/skinview3d/bundles/skinview3d.bundle.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #0e0e0e;
            color: #e6e6e6;
        }
        header {
            background: #1c1c1c;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #2e2e2e;
        }
        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }
        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        section {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #2c2c2c;
        }
        section h2 {
            margin-top: 0;
            font-size: 22px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        button {
            background: #3a8b3a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }
        button:hover {
            background: #2f732f;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.4;
        }
        .output-box {
            background: #111;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-family: Consolas, monospace;
            white-space: pre-wrap;
            border: 1px solid #333;
        }
        #skinCanvas {
            margin-top: 15px;
            width: 300px;
            height: 400px;
            display: none;
            border: 2px solid #333;
        }
        #usernameDisplay {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Minecraft Web Client</h1>
    </header>

    <main>

        <!-- Microsoft Login -->
        <section>
            <h2>Microsoft Authentication</h2>
            <button onclick="redirectToMicrosoft()">Start Microsoft Authentication</button>
            <div id="loginOutput" class="output-box"></div>
        </section>

        <!-- Xbox Live -->
        <section>
            <h2>Xbox Live Authentication</h2>
            <button onclick="authXBL()">Authenticate with Xbox Live</button>
            <div id="xblOutput" class="output-box"></div>
        </section>

        <!-- XSTS -->
        <section>
            <h2>XSTS Authorization</h2>
            <button onclick="authXSTS()">Request XSTS Token</button>
            <div id="xstsOutput" class="output-box"></div>
        </section>

        <!-- Minecraft Auth -->
        <section>
            <h2>Minecraft Authentication</h2>
            <button onclick="authMinecraft()">Authenticate with Minecraft</button>
            <div id="mcOutput" class="output-box"></div>

            <canvas id="skinCanvas" width="300" height="400"></canvas>
            <div id="usernameDisplay"></div>
        </section>

        <!-- Continue -->
        <section>
            <h2>Continue</h2>
            <button id="continueBtn" disabled onclick="goToClient()">Go to Client</button>
        </section>

    </main>

    <footer>
        Minecraft Web Client — Full Authentication Enabled
    </footer>

    <script>
        const backend = "https://minecraftwebclient-backend.onrender.com";

        let msAccessToken = null;
        let xblData = null;
        let xstsData = null;

        // -------------------------------
        // Microsoft Login
        // -------------------------------
        function redirectToMicrosoft() {
            window.location.href = backend + "/auth/login";
        }

        function checkForMsToken() {
            const params = new URLSearchParams(window.location.search);
            const raw = params.get("ms_token");

            if (!raw) return;

            let parsed;
            try {
                parsed = JSON.parse(decodeURIComponent(raw));
            } catch {
                document.getElementById("loginOutput").textContent = "❌ Failed to parse ms_token.";
                return;
            }

            msAccessToken = parsed.access_token;

            document.getElementById("loginOutput").textContent =
                "✔ Microsoft login complete\n\n" +
                JSON.stringify(parsed, null, 2);

            window.history.replaceState({}, document.title, "/MinecraftWebClient/");
        }

        // -------------------------------
        // Xbox Live
        // -------------------------------
        async function authXBL() {
            if (!msAccessToken) return alert("Login with Microsoft first.");

            const res = await fetch(backend + "/auth/xbl", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ access_token: msAccessToken })
            });

            xblData = await res.json();

            document.getElementById("xblOutput").textContent =
                "✔ Xbox Live authentication successful\n\n" +
                JSON.stringify(xblData, null, 2);
        }

        // -------------------------------
        // XSTS
        // -------------------------------
        async function authXSTS() {
            if (!xblData) return alert("You must complete Xbox Live authentication first.");

            const res = await fetch(backend + "/auth/xsts", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    xbl_token: xblData.Token,
                    uhs: xblData.DisplayClaims.xui[0].uhs
                })
            });

            xstsData = await res.json();

            document.getElementById("xstsOutput").textContent =
                "✔ XSTS authorization successful\n\n" +
                JSON.stringify(xstsData, null, 2);
        }

        // -------------------------------
        // Minecraft Auth
        // -------------------------------
        async function authMinecraft() {
            if (!xstsData) return alert("You must complete XSTS authentication first.");

            const res = await fetch(backend + "/auth/mc", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    xsts_token: xstsData.Token,
                    uhs: xstsData.DisplayClaims.xui[0].uhs
                })
            });

            const mcJson = await res.json();

            // ❌ If backend returned an error, show it and STOP
            if (mcJson.error) {
                document.getElementById("mcOutput").textContent =
                    "❌ Minecraft authentication failed\n\n" +
                    JSON.stringify(mcJson, null, 2);
                return;
            }

            // ✔ Success
            document.getElementById("mcOutput").textContent =
                "✔ Minecraft authentication successful\n\n" +
                JSON.stringify(mcJson, null, 2);

            // Username
            document.getElementById("usernameDisplay").textContent =
                "Logged in as: " + mcJson.profile.name;
            document.getElementById("usernameDisplay").style.display = "block";

            // Skin
            const skinUrl = mcJson.profile.skins?.[0]?.url;
            if (skinUrl) {
                const canvas = document.getElementById("skinCanvas");
                canvas.style.display = "block";

                const viewer = new skinview3d.SkinViewer({
                    canvas: canvas,
                    width: 300,
                    height: 400,
                    skin: skinUrl
                });

                viewer.controls.enableZoom = false;
                viewer.animation = new skinview3d.IdleAnimation();
            }

            // Unlock continue
            const btn = document.getElementById("continueBtn");
            btn.disabled = false;
            btn.style.opacity = "1";
            btn.style.cursor = "pointer";
        }

        // -------------------------------
        // Continue
        // -------------------------------
        function goToClient() {
            const entryToken = Math.random().toString(36).substring(2);
            sessionStorage.setItem("entryToken", entryToken);
            window.location.href = "client.html?entry=" + entryToken;
        }

        checkForMsToken();
    </script>
</body>
</html>
