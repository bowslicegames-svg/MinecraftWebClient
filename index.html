<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Minecraft Web Auth</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 10px 0;
      background: #4caf50;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    pre {
      background: #222;
      padding: 10px;
      border-radius: 5px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <h1>Minecraft Web Authentication</h1>

  <h2>Step 1 — Microsoft Login</h2>
  <button onclick="startMicrosoftLogin()">Login with Microsoft</button>

  <h2>Step 2 — Xbox Live Authentication</h2>
  <button onclick="authXBL()">Authenticate with Xbox Live</button>
  <pre id="xblOutput"></pre>

  <h2>Step 3 — XSTS Authorization</h2>
  <button onclick="authXSTS()">Request XSTS Token</button>
  <pre id="xstsOutput"></pre>

  <h2>Step 4 — Minecraft Authentication</h2>
  <button onclick="authMinecraft()">Authenticate with Minecraft</button>
  <pre id="mcOutput"></pre>

  <h2>Continue</h2>
  <button onclick="continueToGame()">Continue</button>

  <script>
    const backend = "https://minecraftwebclient-backend.onrender.com";

    let msAccessToken = null;
    let xblToken = null;
    let xblUHS = null;
    let xstsToken = null;

    // -------------------------------
    // Step 1 — Microsoft Login
    // -------------------------------
    function startMicrosoftLogin() {
      window.location.href = backend + "/auth/login";
    }

    // Parse Microsoft token from redirect
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has("ms_token")) {
      const tokenJson = JSON.parse(urlParams.get("ms_token"));
      msAccessToken = tokenJson.access_token;
      console.log("Microsoft Access Token:", msAccessToken);
    }

    // -------------------------------
    // Step 2 — Xbox Live Auth
    // -------------------------------
    async function authXBL() {
      if (!msAccessToken) {
        alert("You must log in with Microsoft first.");
        return;
      }

      const res = await fetch(backend + "/auth/xbl", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ access_token: msAccessToken })
      });

      const data = await res.json();
      document.getElementById("xblOutput").textContent = JSON.stringify(data, null, 2);

      xblToken = data.Token;
      xblUHS = data.DisplayClaims?.xui?.[0]?.uhs;
    }

    // -------------------------------
    // Step 3 — XSTS Auth
    // -------------------------------
    async function authXSTS() {
      if (!xblToken || !xblUHS) {
        alert("You must complete Xbox Live authentication first.");
        return;
      }

      const res = await fetch(backend + "/auth/xsts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          xbl_token: xblToken,
          uhs: xblUHS
        })
      });

      const data = await res.json();
      document.getElementById("xstsOutput").textContent = JSON.stringify(data, null, 2);

      xstsToken = data.Token;
    }

    // -------------------------------
    // Step 4 — Minecraft Auth
    // -------------------------------
    async function authMinecraft() {
      if (!xstsToken || !xblUHS) {
        alert("You must complete XSTS authentication first.");
        return;
      }

      const res = await fetch(backend + "/auth/mc", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          xsts_token: xstsToken,
          uhs: xblUHS
        })
      });

      const data = await res.json();
      document.getElementById("mcOutput").textContent = JSON.stringify(data, null, 2);
    }

    // -------------------------------
    // Continue Button
    // -------------------------------
    function continueToGame() {
      alert("Authentication complete. Ready to launch the game.");
    }
  </script>

</body>
</html>
